# Build with:
#   ./compile.sh enable_v9
# Armbian loads userpatches/config-<name>.conf when <name> is given on the command line.
# The build is the same as plain ./compile.sh; the image additionally has the v9 DSI panel
# overlay (rock-4se-rpi7-radxa-vopl-fix) and the FT5406 touch service enabled.
# Board and branch are chosen as usual, in the menu or with BOARD=rock-4se BRANCH=current.
enable_extension "rock-4se-dsi-v9"
